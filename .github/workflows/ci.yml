name: Core CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Parametric Lab server
        run: python -m unittest discover -s tests -p 'test_gui_server.py' -v
      - name: Check Python syntax
        run: python -m py_compile scripts/mbf_gui_server.py tests/test_gui_server.py
      - name: Check Parametric Lab JavaScript syntax
        run: node --check gui/app.js
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
